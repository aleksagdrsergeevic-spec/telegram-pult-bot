<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Пульт</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
      :root {
        --bg: #07060d;
        --bg2: #100c1c;
        --text: #efeafd;
        --hint: #9b90b8;
        --accent: #8b5cf6;
        --accent2: #c084fc;
        --accent-text: #fff;
        --line: rgba(167, 139, 250, 0.16);
      }
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body { height: 100%; margin: 0; }
      body {
        background-color: var(--bg);
        background-image:
          radial-gradient(900px 520px at 12% -12%, rgba(124, 58, 237, 0.42), transparent 62%),
          radial-gradient(760px 520px at 92% 6%, rgba(192, 132, 252, 0.22), transparent 60%),
          radial-gradient(820px 640px at 50% 112%, rgba(76, 29, 149, 0.42), transparent 62%);
        background-attachment: fixed;
        color: var(--text);
        font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        position: relative;
      }
      .bg {
        position: fixed;
        inset: 0;
        pointer-events: none;
        overflow: hidden;
        z-index: 0;
      }
      .blob {
        position: absolute;
        border-radius: 50%;
        filter: blur(70px);
        opacity: 0.5;
        animation: float 18s ease-in-out infinite;
      }
      .blob.b1 { width: 320px; height: 320px; left: -90px; top: 12%; background: #6d28d9; }
      .blob.b2 { width: 280px; height: 280px; right: -80px; top: 48%; background: #a855f7; animation-delay: -7s; }
      @keyframes float {
        0%, 100% { transform: translate3d(0, 0, 0) scale(1); }
        50% { transform: translate3d(26px, -30px, 0) scale(1.12); }
      }
      @media (prefers-reduced-motion: reduce) {
        .blob { animation: none; }
      }
      header, main, footer, .sheet { position: relative; z-index: 1; }
      header {
        display: flex;
        gap: 6px;
        align-items: center;
        padding: 8px 10px;
        border-bottom: 1px solid var(--line);
        background: rgba(16, 12, 28, 0.72);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        flex: 0 0 auto;
      }
      .logo { width: 22px; height: 22px; flex: 0 0 auto; }
      .pill {
        background: rgba(139, 92, 246, 0.14);
        color: var(--text);
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 6px 11px;
        font-size: 13px;
        max-width: 44vw;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .pill b { font-weight: 600; }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #f87171;
        box-shadow: 0 0 8px rgba(248, 113, 113, 0.7);
        flex: 0 0 auto;
        margin-left: auto;
      }
      .dot.on {
        background: #34d399;
        box-shadow: 0 0 10px rgba(52, 211, 153, 0.8);
      }
      .status { margin-left: 6px; font-size: 12px; color: var(--hint); white-space: nowrap; }
      .status.busy { color: var(--accent); }
      main {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 12px 10px 4px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .msg {
        position: relative;
        max-width: 92%;
        padding: 9px 32px 9px 12px;
        border-radius: 14px;
        white-space: pre-wrap;
        word-break: break-word;
        font-size: 14px;
      }
      .msg .text {
        -webkit-user-select: text;
        user-select: text;
        -webkit-touch-callout: default;
      }
      .copy {
        position: absolute;
        top: 3px;
        right: 3px;
        background: transparent;
        border: 0;
        color: rgba(255, 255, 255, 0.4);
        font-size: 13px;
        padding: 3px 6px;
        line-height: 1;
      }
      .copy:active { color: #fff; }
      .msg.queued { opacity: 0.55; }
      .me {
        align-self: flex-end;
        background: linear-gradient(135deg, #7c3aed, #a855f7);
        color: #fff;
        border-bottom-right-radius: 5px;
        box-shadow: 0 6px 20px rgba(124, 58, 237, 0.35);
      }
      .bot {
        align-self: flex-start;
        background: rgba(139, 92, 246, 0.1);
        border: 1px solid rgba(167, 139, 250, 0.24);
        border-bottom-left-radius: 5px;
      }
      .bot code, .bot pre { font-family: ui-monospace, Menlo, monospace; font-size: 12.5px; }
      .note { align-self: center; color: var(--hint); font-size: 12px; text-align: center; }
      .err { align-self: center; color: #f87171; font-size: 13px; text-align: center; }
      .hero {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        margin: auto 0;
        padding: 24px 20px;
        text-align: center;
      }
      .hero[hidden] { display: none; }
      .hero-logo { width: 78px; height: 78px; filter: drop-shadow(0 0 26px rgba(168, 85, 247, 0.55)); }
      .hero-title { font-size: 19px; font-weight: 600; letter-spacing: 0.4px; }
      .hero-sub { color: var(--hint); font-size: 13px; max-width: 260px; }
      .cursor::after { content: "▌"; opacity: 0.6; }
      footer {
        flex: 0 0 auto;
        display: flex;
        gap: 8px;
        align-items: flex-end;
        padding: 8px 10px calc(8px + env(safe-area-inset-bottom));
        border-top: 1px solid var(--line);
        background: rgba(16, 12, 28, 0.78);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
      }
      textarea {
        flex: 1 1 auto;
        resize: none;
        max-height: 120px;
        padding: 10px 12px;
        border-radius: 12px;
        border: 1px solid var(--line);
        background: rgba(7, 6, 13, 0.7);
        color: var(--text);
        font: inherit;
      }
      textarea:focus { outline: none; border-color: var(--accent2); box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.15); }
      .send, .stop {
        width: 44px;
        height: 44px;
        border: 0;
        border-radius: 12px;
        font-size: 18px;
        background: linear-gradient(135deg, #8b5cf6, #c084fc);
        color: #fff;
        box-shadow: 0 6px 18px rgba(139, 92, 246, 0.4);
        flex: 0 0 auto;
      }
      .stop { background: linear-gradient(135deg, #b91c1c, #ef4444); box-shadow: 0 6px 18px rgba(185, 28, 28, 0.4); }
      .sheet {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.55);
        display: flex;
        align-items: flex-end;
        z-index: 10;
      }
      .sheet[hidden] { display: none; }
      .sheet-body {
        width: 100%;
        max-height: 80%;
        overflow-y: auto;
        background: var(--bg);
        border-radius: 16px 16px 0 0;
        padding: 14px 14px calc(16px + env(safe-area-inset-bottom));
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .sheet-body h3 { margin: 0 0 2px; font-size: 15px; font-weight: 600; }
      .item {
        display: flex;
        flex-direction: column;
        gap: 2px;
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--bg2);
        text-align: left;
        color: var(--text);
      }
      .item.active { border-color: var(--accent); }
      .item small { color: var(--hint); font-size: 11.5px; word-break: break-all; }
      input {
        padding: 10px 12px;
        border-radius: 12px;
        border: 1px solid var(--line);
        background: var(--bg2);
        color: var(--text);
        font: inherit;
      }
      button.primary {
        padding: 11px 14px;
        border: 0;
        border-radius: 12px;
        background: var(--accent);
        color: var(--accent-text);
        font-weight: 600;
        font-size: 14px;
      }
      .close { align-self: flex-end; background: transparent; border: 0; color: var(--hint); font-size: 13px; }
    </style>
  </head>
  <body>
    <div class="bg"><span class="blob b1"></span><span class="blob b2"></span></div>
    <header>
      <svg class="logo" viewBox="0 0 40 40" aria-hidden="true">
        <defs>
          <linearGradient id="spark1" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#e9d5ff" />
            <stop offset="1" stop-color="#7c3aed" />
          </linearGradient>
          <filter id="glow1"><feGaussianBlur stdDeviation="1.4" result="b" /><feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge></filter>
        </defs>
        <g fill="url(#spark1)" filter="url(#glow1)" transform="translate(20 20)">
          <rect x="-2" y="-16" width="4" height="32" rx="2" />
          <rect x="-2" y="-16" width="4" height="32" rx="2" transform="rotate(45)" />
          <rect x="-2" y="-16" width="4" height="32" rx="2" transform="rotate(90)" />
          <rect x="-2" y="-16" width="4" height="32" rx="2" transform="rotate(135)" />
        </g>
      </svg>
      <button class="pill" id="sessionBtn">📁 <b id="sessionName">…</b></button>
      <button class="pill" id="modelBtn">🤖 <b id="modelName">…</b></button>
      <span class="dot" id="dot"></span>
      <span class="status" id="status"></span>
    </header>

    <main id="log">
      <div class="hero" id="hero">
        <svg class="hero-logo" viewBox="0 0 40 40" aria-hidden="true">
          <defs>
            <linearGradient id="spark2" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#f5f3ff" />
              <stop offset="1" stop-color="#8b5cf6" />
            </linearGradient>
            <filter id="glow2"><feGaussianBlur stdDeviation="1.2" result="b" /><feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge></filter>
          </defs>
          <g fill="url(#spark2)" filter="url(#glow2)" transform="translate(20 20)">
            <rect x="-1.9" y="-15" width="3.8" height="30" rx="1.9" />
            <rect x="-1.9" y="-15" width="3.8" height="30" rx="1.9" transform="rotate(45)" />
            <rect x="-1.9" y="-15" width="3.8" height="30" rx="1.9" transform="rotate(90)" />
            <rect x="-1.9" y="-15" width="3.8" height="30" rx="1.9" transform="rotate(135)" />
          </g>
        </svg>
        <div class="hero-title">Пульт</div>
        <div class="hero-sub">Напишите задачу — OpenCode выполнит её в выбранной папке</div>
      </div>
    </main>

    <footer>
      <textarea id="input" rows="1" placeholder="Задача для OpenCode…"></textarea>
      <button class="send" id="sendBtn" title="Отправить">➤</button>
      <button class="stop" id="stopBtn" title="Остановить задачу и очистить очередь" hidden>■</button>
    </footer>

    <div class="sheet" id="sessionSheet" hidden>
      <div class="sheet-body">
        <button class="close" data-close="sessionSheet">закрыть</button>
        <h3>Папки-сессии</h3>
        <div id="sessionsList"></div>
        <input id="newName" placeholder="имя папки или git-url" />
        <button class="primary" id="createBtn">Создать и выбрать</button>
      </div>
    </div>

    <div class="sheet" id="modelSheet" hidden>
      <div class="sheet-body">
        <button class="close" data-close="modelSheet">закрыть</button>
        <h3>Модель</h3>
        <div id="modelsList"></div>
      </div>
    </div>

    <script>
      const tg = window.Telegram && window.Telegram.WebApp;
      if (tg) {
        tg.ready();
        tg.expand();
        if (tg.setHeaderColor) tg.setHeaderColor('#07060d');
        if (tg.setBackgroundColor) tg.setBackgroundColor('#07060d');
      }

      const el = {
        log: document.getElementById('log'),
        input: document.getElementById('input'),
        send: document.getElementById('sendBtn'),
        stop: document.getElementById('stopBtn'),
        status: document.getElementById('status'),
        dot: document.getElementById('dot'),
        hero: document.getElementById('hero'),
        sessionName: document.getElementById('sessionName'),
        modelName: document.getElementById('modelName'),
        sessionBtn: document.getElementById('sessionBtn'),
        modelBtn: document.getElementById('modelBtn'),
        sessionSheet: document.getElementById('sessionSheet'),
        modelSheet: document.getElementById('modelSheet'),
        sessionsList: document.getElementById('sessionsList'),
        modelsList: document.getElementById('modelsList'),
        newName: document.getElementById('newName'),
        createBtn: document.getElementById('createBtn'),
      };

      let token = null;
      let state = null;
      let es = null;
      let current = null;
      let busy = false;
      let skew = 0;

      function now() {
        return Date.now() - skew;
      }

      function tick() {
        const queued = state && state.queued ? state.queued : 0;
        if (!state || !state.task) {
          el.dot.classList.remove('on');
          el.status.textContent = queued ? 'в очереди: ' + queued : '';
          el.status.classList.remove('busy');
          return;
        }
        const elapsed = Math.round((now() - state.task.startedAt) / 1000);
        const quiet = Math.round((now() - (state.task.lastOutputAt || state.task.startedAt)) / 1000);
        el.dot.classList.add('on');
        el.status.textContent =
          (quiet >= 30 ? 'молчит ' + dur(quiet) : 'работает') +
          ' · ' +
          dur(elapsed) +
          (queued ? ' · в очереди: ' + queued : '');
        el.status.classList.add('busy');
      }
      setInterval(tick, 1000);

      function scrollDown() {
        el.log.scrollTop = el.log.scrollHeight;
      }

      function note(text, cls) {
        const div = document.createElement('div');
        div.className = cls || 'note';
        div.textContent = text;
        el.log.appendChild(div);
        scrollDown();
        return div;
      }

      async function copyText(text) {
        try {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            await navigator.clipboard.writeText(text);
          } else {
            const area = document.createElement('textarea');
            area.value = text;
            area.style.position = 'fixed';
            area.style.opacity = '0';
            document.body.appendChild(area);
            area.select();
            document.execCommand('copy');
            area.remove();
          }
          note('скопировано');
        } catch {
          note('не получилось скопировать — выделите текст вручную', 'err');
        }
      }

      function bubble(text, cls) {
        const div = document.createElement('div');
        div.className = 'msg ' + (cls || 'bot');
        const span = document.createElement('span');
        span.className = 'text';
        span.textContent = text;
        const copy = document.createElement('button');
        copy.type = 'button';
        copy.className = 'copy';
        copy.textContent = '⧉';
        copy.title = 'Скопировать сообщение';
        copy.onclick = (event) => {
          event.stopPropagation();
          void copyText(span.textContent);
        };
        div.append(span, copy);
        el.log.appendChild(div);
        scrollDown();
        return div;
      }

      function dur(seconds) {
        const total = Math.max(0, Math.round(seconds));
        const m = Math.floor(total / 60);
        const s = total % 60;
        if (m > 0) return m + ' мин ' + s + ' с';
        return s + ' с';
      }

      function setBusy(value) {
        busy = value;
        // Кнопка отправки видна всегда: во время работы она добавляет в очередь.
        el.send.hidden = false;
        el.stop.hidden = !value;
        el.send.title = value ? 'Добавить в очередь' : 'Отправить';
        if (!value) {
          el.status.textContent = '';
          el.status.classList.remove('busy');
        }
        tick();
      }

      function renderState(next) {
        state = next;
        skew = next.now ? Date.now() - next.now : 0;
        el.sessionName.textContent = next.current ? next.current.name : 'нет сессии';
        el.modelName.textContent = (next.current && next.current.model) || next.model || '—';
        setBusy(!!next.running);
        renderSessions();
      }

      function renderSessions() {
        el.sessionsList.textContent = '';
        const list = (state && state.sessions) || [];
        if (!list.length) {
          const empty = document.createElement('small');
          empty.textContent = 'Пока нет папок — создайте первую ниже.';
          el.sessionsList.appendChild(empty);
          return;
        }
        for (const item of list) {
          const btn = document.createElement('button');
          btn.className = 'item' + (state.current && state.current.name === item.name ? ' active' : '');
          const title = document.createElement('span');
          title.textContent = item.name;
          const sub = document.createElement('small');
          sub.textContent = item.path;
          btn.append(title, sub);
          btn.onclick = async () => {
            const next = await api('/api/session', { action: 'use', name: item.name });
            if (next) {
              renderState(next);
              closeSheets();
              void loadHistory();
            }
          };
          el.sessionsList.appendChild(btn);
        }
      }

      function closeSheets() {
        el.sessionSheet.hidden = true;
        el.modelSheet.hidden = true;
      }

      async function api(path, body) {
        const res = await fetch(path, {
          method: body ? 'POST' : 'GET',
          headers: { 'content-type': 'application/json', authorization: 'Bearer ' + token },
          body: body ? JSON.stringify(body) : undefined,
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          note(data.error || 'Ошибка ' + res.status, 'err');
          return null;
        }
        return data;
      }

      function showHero(value) {
        if (!el.hero) return;
        el.hero.hidden = !value;
      }

      async function loadHistory() {
        el.log.textContent = '';
        el.log.appendChild(el.hero);
        const name = state && state.current ? state.current.name : '';
        if (!name) {
          showHero(true);
          note('Нет сессии — откройте список папок и создайте её.');
          return;
        }
        const data = await api('/api/history?session=' + encodeURIComponent(name));
        if (!data) return;
        const messages = data.messages || [];
        showHero(messages.length === 0);
        for (const item of messages) {
          bubble(item.text, item.role === 'user' ? 'me' : 'bot');
        }
        scrollDown();
      }

      async function connect() {
        if (!tg || !tg.initData) {
          note('Откройте пульт из Telegram: кнопкой в меню бота.', 'err');
          return;
        }
        const res = await fetch('/api/auth', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ initData: tg.initData }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok || !data.token) {
          note(data.error || 'Не удалось авторизоваться', 'err');
          return;
        }
        token = data.token;
        renderState(data.state);
        subscribe();
        void loadHistory();
      }

      function subscribe() {
        if (es) es.close();
        es = new EventSource('/api/stream?t=' + encodeURIComponent(token));

        es.addEventListener('start', (e) => {
          const data = JSON.parse(e.data);
          current = bubble('', 'bot');
          current.classList.add('cursor');
          showHero(false);
          note('▶ ' + data.session + ' · ' + data.model);
          if (!state) state = {};
          state.task = { startedAt: now(), lastOutputAt: now() };
          if (state.queued) state.queued = Math.max(0, state.queued - 1);
          setBusy(true);
        });
        es.addEventListener('chunk', (e) => {
          const data = JSON.parse(e.data);
          if (!current) current = bubble('', 'bot');
          const textEl = current.querySelector('.text');
          if (textEl) textEl.textContent += data.text;
          if (state && state.task) state.task.lastOutputAt = now();
          scrollDown();
        });

        es.addEventListener('done', (e) => {
          const data = JSON.parse(e.data);
          if (current) current.classList.remove('cursor');
          if (data.stopped) note('⏹ остановлено · ' + data.elapsed);
          else if (data.timedOut) note('⏰ таймаут · ' + data.elapsed);
          else if (!data.ok) note('❌ код ' + data.code + (data.error ? ': ' + data.error : ''), 'err');
          else note('✅ готово · ' + data.elapsed);
          current = null;
          if (state) state.task = null;
          setBusy(false);
          refresh();
        });

        es.addEventListener('error', (e) => {
          if (e && e.data) {
            try {
              note(JSON.parse(e.data).message, 'err');
            } catch {
              /* ignore */
            }
          }
        });

        es.addEventListener('notice', (e) => {
          try {
            note(JSON.parse(e.data).message);
          } catch {
            /* ignore */
          }
        });

        es.addEventListener('idle', (e) => {
          try {
            const data = JSON.parse(e.data);
            note(
              '⏳ модель молчит ' + dur(data.seconds) + ' — задача выполняется' +
                (data.limit ? ', предел ' + dur(data.limit) : ''),
            );
          } catch {
            /* ignore */
          }
        });

        es.onerror = () => {
          /* браузер сам переподключится */
        };
      }

      async function refresh() {
        const next = await api('/api/state');
        if (next) renderState(next);
      }

      function send() {
        const text = el.input.value.trim();
        if (!text) return;
        el.input.value = '';
        el.input.style.height = 'auto';
        const mine = bubble(text, 'me');
        showHero(false);
        if (busy) mine.classList.add('queued');
        void fetch('/api/prompt', {
          method: 'POST',
          headers: { 'content-type': 'application/json', authorization: 'Bearer ' + token },
          body: JSON.stringify({ text }),
        })
          .then(async (res) => {
            const data = await res.json().catch(() => ({}));
            if (!res.ok) {
              note(data.error || 'ошибка ' + res.status, 'err');
              return;
            }
            if (data.queued) note('в очереди: ' + data.position);
          })
          .catch(() => note('не смог отправить', 'err'));
        if (!busy) {
          current = null;
          setBusy(true);
        }
      }

      el.send.onclick = send;
      el.stop.onclick = async () => {
        el.stop.disabled = true;
        const data = await api('/api/stop', {});
        if (data && data.stopped) note('⏹ останавливаю…');
        else note('нечего останавливать');
        setTimeout(() => {
          el.stop.disabled = false;
        }, 3000);
      };

      el.input.addEventListener('input', () => {
        el.input.style.height = 'auto';
        el.input.style.height = Math.min(el.input.scrollHeight, 120) + 'px';
      });
      el.input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          send();
        }
      });

      el.sessionBtn.onclick = () => {
        el.sessionSheet.hidden = false;
      };
      el.modelBtn.onclick = async () => {
        el.modelSheet.hidden = false;
        el.modelsList.textContent = 'загружаю…';
        const data = await api('/api/models');
        el.modelsList.textContent = '';
        if (!data) return;
        for (const model of data.list) {
          const btn = document.createElement('button');
          btn.className = 'item' + (data.current === model ? ' active' : '');
          btn.textContent = model;
          btn.onclick = async () => {
            const next = await api('/api/model', { model });
            if (next) {
              renderState(next);
              closeSheets();
            }
          };
          el.modelsList.appendChild(btn);
        }
        if (!data.list.length) {
          const small = document.createElement('small');
          small.textContent = 'Список пуст — проверьте вход в OpenCode (pult-opencode auth login).';
          el.modelsList.appendChild(small);
        }
      };

      el.createBtn.onclick = async () => {
        const name = el.newName.value.trim();
        if (!name) return;
        const next = await api('/api/session', { action: 'new', name });
        if (next) {
          el.newName.value = '';
          renderState(next);
          closeSheets();
          void loadHistory();
        }
      };

      for (const btn of document.querySelectorAll('[data-close]')) {
        btn.onclick = () => {
          document.getElementById(btn.dataset.close).hidden = true;
        };
      }
      for (const sheet of document.querySelectorAll('.sheet')) {
        sheet.addEventListener('click', (e) => {
          if (e.target === sheet) sheet.hidden = true;
        });
      }

      void connect();
    </script>
  </body>
</html>
