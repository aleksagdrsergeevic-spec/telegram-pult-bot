<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Пульт</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
      :root {
        --bg: var(--tg-theme-bg-color, #0f1115);
        --bg2: var(--tg-theme-secondary-bg-color, #171a21);
        --text: var(--tg-theme-text-color, #e8eaed);
        --hint: var(--tg-theme-hint-color, #8b93a1);
        --accent: var(--tg-theme-button-color, #4f8cff);
        --accent-text: var(--tg-theme-button-text-color, #fff);
        --line: rgba(255, 255, 255, 0.08);
      }
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body { height: 100%; margin: 0; }
      body {
        background: var(--bg);
        color: var(--text);
        font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      header {
        display: flex;
        gap: 6px;
        align-items: center;
        padding: 8px 10px;
        border-bottom: 1px solid var(--line);
        background: var(--bg2);
        flex: 0 0 auto;
      }
      .pill {
        background: rgba(255, 255, 255, 0.06);
        color: var(--text);
        border: 0;
        border-radius: 999px;
        padding: 6px 11px;
        font-size: 13px;
        max-width: 46vw;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .pill b { font-weight: 600; }
      .status { margin-left: auto; font-size: 12px; color: var(--hint); white-space: nowrap; }
      .status.busy { color: var(--accent); }
      main {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 12px 10px 4px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .msg {
        max-width: 92%;
        padding: 9px 12px;
        border-radius: 14px;
        white-space: pre-wrap;
        word-break: break-word;
        font-size: 14px;
      }
      .me { align-self: flex-end; background: var(--accent); color: var(--accent-text); border-bottom-right-radius: 5px; }
      .bot { align-self: flex-start; background: var(--bg2); border: 1px solid var(--line); border-bottom-left-radius: 5px; }
      .bot code, .bot pre { font-family: ui-monospace, Menlo, monospace; font-size: 12.5px; }
      .note { align-self: center; color: var(--hint); font-size: 12px; text-align: center; }
      .err { align-self: center; color: #ff6b6b; font-size: 13px; text-align: center; }
      .cursor::after { content: "▌"; opacity: 0.6; }
      footer {
        flex: 0 0 auto;
        display: flex;
        gap: 8px;
        align-items: flex-end;
        padding: 8px 10px calc(8px + env(safe-area-inset-bottom));
        border-top: 1px solid var(--line);
        background: var(--bg2);
      }
      textarea {
        flex: 1 1 auto;
        resize: none;
        max-height: 120px;
        padding: 10px 12px;
        border-radius: 12px;
        border: 1px solid var(--line);
        background: var(--bg);
        color: var(--text);
        font: inherit;
      }
      textarea:focus { outline: none; border-color: var(--accent); }
      .send, .stop {
        width: 44px;
        height: 44px;
        border: 0;
        border-radius: 12px;
        font-size: 18px;
        background: var(--accent);
        color: var(--accent-text);
        flex: 0 0 auto;
      }
      .stop { background: #e0524f; }
      .sheet {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.55);
        display: flex;
        align-items: flex-end;
        z-index: 10;
      }
      .sheet[hidden] { display: none; }
      .sheet-body {
        width: 100%;
        max-height: 80%;
        overflow-y: auto;
        background: var(--bg);
        border-radius: 16px 16px 0 0;
        padding: 14px 14px calc(16px + env(safe-area-inset-bottom));
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .sheet-body h3 { margin: 0 0 2px; font-size: 15px; font-weight: 600; }
      .item {
        display: flex;
        flex-direction: column;
        gap: 2px;
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--bg2);
        text-align: left;
        color: var(--text);
      }
      .item.active { border-color: var(--accent); }
      .item small { color: var(--hint); font-size: 11.5px; word-break: break-all; }
      input {
        padding: 10px 12px;
        border-radius: 12px;
        border: 1px solid var(--line);
        background: var(--bg2);
        color: var(--text);
        font: inherit;
      }
      button.primary {
        padding: 11px 14px;
        border: 0;
        border-radius: 12px;
        background: var(--accent);
        color: var(--accent-text);
        font-weight: 600;
        font-size: 14px;
      }
      .close { align-self: flex-end; background: transparent; border: 0; color: var(--hint); font-size: 13px; }
    </style>
  </head>
  <body>
    <header>
      <button class="pill" id="sessionBtn">📁 <b id="sessionName">…</b></button>
      <button class="pill" id="modelBtn">🤖 <b id="modelName">…</b></button>
      <span class="status" id="status"></span>
    </header>

    <main id="log"></main>

    <footer>
      <textarea id="input" rows="1" placeholder="Задача для OpenCode…"></textarea>
      <button class="send" id="sendBtn" title="Отправить">➤</button>
      <button class="stop" id="stopBtn" title="Остановить" hidden>■</button>
    </footer>

    <div class="sheet" id="sessionSheet" hidden>
      <div class="sheet-body">
        <button class="close" data-close="sessionSheet">закрыть</button>
        <h3>Папки-сессии</h3>
        <div id="sessionsList"></div>
        <input id="newName" placeholder="имя папки или git-url" />
        <button class="primary" id="createBtn">Создать и выбрать</button>
      </div>
    </div>

    <div class="sheet" id="modelSheet" hidden>
      <div class="sheet-body">
        <button class="close" data-close="modelSheet">закрыть</button>
        <h3>Модель</h3>
        <div id="modelsList"></div>
      </div>
    </div>

    <script>
      const tg = window.Telegram && window.Telegram.WebApp;
      if (tg) {
        tg.ready();
        tg.expand();
        if (tg.setHeaderColor) tg.setHeaderColor('secondary_bg_color');
      }

      const el = {
        log: document.getElementById('log'),
        input: document.getElementById('input'),
        send: document.getElementById('sendBtn'),
        stop: document.getElementById('stopBtn'),
        status: document.getElementById('status'),
        sessionName: document.getElementById('sessionName'),
        modelName: document.getElementById('modelName'),
        sessionBtn: document.getElementById('sessionBtn'),
        modelBtn: document.getElementById('modelBtn'),
        sessionSheet: document.getElementById('sessionSheet'),
        modelSheet: document.getElementById('modelSheet'),
        sessionsList: document.getElementById('sessionsList'),
        modelsList: document.getElementById('modelsList'),
        newName: document.getElementById('newName'),
        createBtn: document.getElementById('createBtn'),
      };

      let token = null;
      let state = null;
      let es = null;
      let current = null;
      let busy = false;

      function scrollDown() {
        el.log.scrollTop = el.log.scrollHeight;
      }

      function note(text, cls) {
        const div = document.createElement('div');
        div.className = cls || 'note';
        div.textContent = text;
        el.log.appendChild(div);
        scrollDown();
        return div;
      }

      function bubble(text, cls) {
        const div = document.createElement('div');
        div.className = 'msg ' + (cls || 'bot');
        div.textContent = text;
        el.log.appendChild(div);
        scrollDown();
        return div;
      }

      function setBusy(value) {
        busy = value;
        el.send.hidden = value;
        el.stop.hidden = !value;
        el.status.textContent = value ? 'работаю…' : '';
        el.status.classList.toggle('busy', value);
      }

      function renderState(next) {
        state = next;
        el.sessionName.textContent = next.current ? next.current.name : 'нет сессии';
        el.modelName.textContent = (next.current && next.current.model) || next.model || '—';
        setBusy(!!next.running);
        renderSessions();
      }

      function renderSessions() {
        el.sessionsList.textContent = '';
        const list = (state && state.sessions) || [];
        if (!list.length) {
          const empty = document.createElement('small');
          empty.textContent = 'Пока нет папок — создайте первую ниже.';
          el.sessionsList.appendChild(empty);
          return;
        }
        for (const item of list) {
          const btn = document.createElement('button');
          btn.className = 'item' + (state.current && state.current.name === item.name ? ' active' : '');
          const title = document.createElement('span');
          title.textContent = item.name;
          const sub = document.createElement('small');
          sub.textContent = item.path;
          btn.append(title, sub);
          btn.onclick = async () => {
            const next = await api('/api/session', { action: 'use', name: item.name });
            if (next) {
              renderState(next);
              closeSheets();
            }
          };
          el.sessionsList.appendChild(btn);
        }
      }

      function closeSheets() {
        el.sessionSheet.hidden = true;
        el.modelSheet.hidden = true;
      }

      async function api(path, body) {
        const res = await fetch(path, {
          method: body ? 'POST' : 'GET',
          headers: { 'content-type': 'application/json', authorization: 'Bearer ' + token },
          body: body ? JSON.stringify(body) : undefined,
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          note(data.error || 'Ошибка ' + res.status, 'err');
          return null;
        }
        return data;
      }

      async function connect() {
        if (!tg || !tg.initData) {
          note('Откройте пульт из Telegram: кнопкой в меню бота.', 'err');
          return;
        }
        const res = await fetch('/api/auth', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ initData: tg.initData }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok || !data.token) {
          note(data.error || 'Не удалось авторизоваться', 'err');
          return;
        }
        token = data.token;
        renderState(data.state);
        subscribe();
      }

      function subscribe() {
        if (es) es.close();
        es = new EventSource('/api/stream?t=' + encodeURIComponent(token));

        es.addEventListener('start', (e) => {
          const data = JSON.parse(e.data);
          current = bubble('', 'bot');
          current.classList.add('cursor');
          note('▶ ' + data.session + ' · ' + data.model);
          setBusy(true);
        });

        es.addEventListener('chunk', (e) => {
          const data = JSON.parse(e.data);
          if (!current) current = bubble('', 'bot');
          current.textContent += data.text;
          scrollDown();
        });

        es.addEventListener('done', (e) => {
          const data = JSON.parse(e.data);
          if (current) current.classList.remove('cursor');
          if (data.stopped) note('⏹ остановлено · ' + data.elapsed);
          else if (data.timedOut) note('⏰ таймаут · ' + data.elapsed);
          else if (!data.ok) note('❌ код ' + data.code + (data.error ? ': ' + data.error : ''), 'err');
          else note('✅ готово · ' + data.elapsed);
          current = null;
          setBusy(false);
          refresh();
        });

        es.addEventListener('error', (e) => {
          if (e && e.data) {
            try {
              note(JSON.parse(e.data).message, 'err');
            } catch {
              /* ignore */
            }
          }
        });

        es.onerror = () => {
          /* браузер сам переподключится */
        };
      }

      async function refresh() {
        const next = await api('/api/state');
        if (next) renderState(next);
      }

      function send() {
        const text = el.input.value.trim();
        if (!text || busy) return;
        el.input.value = '';
        el.input.style.height = 'auto';
        bubble(text, 'me');
        current = null;
        void fetch('/api/prompt', {
          method: 'POST',
          headers: { 'content-type': 'application/json', authorization: 'Bearer ' + token },
          body: JSON.stringify({ text }),
        });
        setBusy(true);
      }

      el.send.onclick = send;
      el.stop.onclick = async () => {
        await api('/api/stop', {});
      };

      el.input.addEventListener('input', () => {
        el.input.style.height = 'auto';
        el.input.style.height = Math.min(el.input.scrollHeight, 120) + 'px';
      });
      el.input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          send();
        }
      });

      el.sessionBtn.onclick = () => {
        el.sessionSheet.hidden = false;
      };
      el.modelBtn.onclick = async () => {
        el.modelSheet.hidden = false;
        el.modelsList.textContent = 'загружаю…';
        const data = await api('/api/models');
        el.modelsList.textContent = '';
        if (!data) return;
        for (const model of data.list) {
          const btn = document.createElement('button');
          btn.className = 'item' + (data.current === model ? ' active' : '');
          btn.textContent = model;
          btn.onclick = async () => {
            const next = await api('/api/model', { model });
            if (next) {
              renderState(next);
              closeSheets();
            }
          };
          el.modelsList.appendChild(btn);
        }
        if (!data.list.length) {
          const small = document.createElement('small');
          small.textContent = 'Список пуст — проверьте вход в OpenCode (pult-opencode auth login).';
          el.modelsList.appendChild(small);
        }
      };

      el.createBtn.onclick = async () => {
        const name = el.newName.value.trim();
        if (!name) return;
        const next = await api('/api/session', { action: 'new', name });
        if (next) {
          el.newName.value = '';
          renderState(next);
          closeSheets();
        }
      };

      for (const btn of document.querySelectorAll('[data-close]')) {
        btn.onclick = () => {
          document.getElementById(btn.dataset.close).hidden = true;
        };
      }
      for (const sheet of document.querySelectorAll('.sheet')) {
        sheet.addEventListener('click', (e) => {
          if (e.target === sheet) sheet.hidden = true;
        });
      }

      void connect();
    </script>
  </body>
</html>
